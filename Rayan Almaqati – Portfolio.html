<style>
:root{--paper:#e9ddcb;--desk:#cbb99d;--ink:#372c2c;--soft:#65564c;--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .25 0 0 0 0 .17 0 0 0 0 .08 0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip;scroll-padding-top:calc(66px + env(safe-area-inset-top,0px))}
body{margin:0;background-color:var(--desk);background-image:var(--grain),radial-gradient(ellipse at 50% 0,rgba(255,240,215,.3),transparent 60%);color:var(--ink);font:400 1.04rem/1.6 "Libre Caslon Text",Georgia,"Times New Roman",serif;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3,h4{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background-color:var(--paper);background-image:var(--grain);border-bottom:6px double var(--ink)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:54px}
.brand{font:400 1.3rem Anton,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav li a{display:block;padding:6px 9px;color:var(--soft);text-decoration:none;font-size:.9rem;font-style:italic;white-space:nowrap}
.nav li a:hover,.nav li a.on{color:var(--ink);box-shadow:inset 0 -2px var(--ink)}
#pg{font:400 .9rem Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
main{padding-top:28px}
.page{position:relative;margin:0 0 36px;padding:36px 48px 46px;background-color:var(--paper);background-image:radial-gradient(ellipse at 12% 6%,rgba(150,110,70,.2),transparent 38%),radial-gradient(ellipse at 92% 88%,rgba(140,100,60,.18),transparent 42%),radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(110,80,50,.2)),var(--grain);box-shadow:inset 0 0 70px rgba(120,85,50,.28),0 26px 46px -28px rgba(40,28,20,.75);text-shadow:0 0 .6px rgba(55,44,44,.45);transform-origin:50% 0;transform:perspective(1800px) rotateX(calc((1 - var(--p,1))*-50deg));opacity:calc(.35 + .65*var(--p,1))}
.page.b{transform-origin:0 50%;transform:perspective(1800px) rotateY(calc((1 - var(--p,1))*45deg))}
.page::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(90deg,transparent,rgba(90,65,40,.14),transparent);pointer-events:none}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(40,28,20,.5),transparent 65%);opacity:calc(1 - var(--p,1))}
.r3{height:10px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);margin:10px 0}
.r1{border-top:2px solid var(--ink);margin:10px 0}
.run{display:flex;justify-content:space-between;gap:10px;font:400 .95rem Anton,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.mast{font:400 clamp(3.4rem,14.5vw,10.5rem)/.92 Anton,Impact,sans-serif;text-transform:uppercase;text-align:center;margin:14px 0;text-wrap:balance}
.dl{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;font:400 1.1rem Anton,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:8px 0}
.dl i{font-style:normal}
.big{font:900 clamp(1.8rem,6.2vw,4.4rem)/1.02 "Playfair Display",Georgia,serif;text-transform:uppercase;text-align:center;margin:14px 0;text-wrap:balance}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:22px}
.sub{font:700 1.55rem/1.15 "Playfair Display",Georgia,serif;text-transform:uppercase;margin:0 0 14px}
.body{font-style:italic;text-align:justify;hyphens:auto;margin:0 0 14px}
.pq{border:3px solid var(--ink);padding:14px 18px;text-align:center;font:700 1.2rem/1.25 "Playfair Display",Georgia,serif;text-transform:uppercase;margin:20px 0}
.frame{border:3px solid var(--ink);padding:16px 20px;margin-bottom:18px;background:rgba(55,44,44,.05)}
.frame h4{font:400 1.25rem Anton,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.frame ol{list-style:none;margin:0;padding:0}
.frame a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;padding:5px 4px;border-bottom:1px dotted var(--soft);font-style:italic}
.frame a:hover{background:rgba(55,44,44,.09)}
.frame b{font:400 1rem Anton,sans-serif;font-style:normal;letter-spacing:.06em}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn{display:inline-block;padding:9px 20px;border:3px solid var(--ink);background:transparent;color:var(--ink);font:400 1rem Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s;text-shadow:none}
.btn:hover,.btn.pri{background:var(--ink);color:var(--paper)}.btn.pri:hover{background:transparent;color:var(--ink)}
.sh{font:900 clamp(1.9rem,5.2vw,3.6rem)/1 "Playfair Display",Georgia,serif;text-transform:uppercase;text-align:center;border-top:6px double var(--ink);border-bottom:6px double var(--ink);padding:12px 0;margin:0 0 28px}
.cols{columns:2;column-gap:38px;column-rule:1px solid var(--ink);text-align:justify;hyphens:auto;font-style:italic}
.cols p{margin:0 0 14px}
.cols p:first-child::first-letter{font:900 3.6rem/.8 "Playfair Display",serif;float:left;padding:6px 8px 0 0;font-style:normal}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:40px}
.box{border:3px solid var(--ink);padding:18px 20px;background:rgba(55,44,44,.05);margin:0}
.box dt{font:400 .95rem Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.box dd{margin:0 0 12px;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid>*{padding:4px 24px;border-left:1px solid var(--ink)}
.grid>*:first-child{border-left:0;padding-left:0}
h3{font:700 1.15rem/1.2 "Playfair Display",Georgia,serif;text-transform:uppercase}
.meta{margin:3px 0 0;font-style:italic;color:var(--soft);font-size:.95rem}
ul.l{margin:12px 0 0;padding:0;list-style:none}
ul.l li{padding:3px 0 3px 16px;position:relative}
ul.l li::before{content:"\25AA";position:absolute;left:0}
.dual{columns:2;column-gap:38px;column-rule:1px solid var(--ink)}
.art{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--ink);break-inside:avoid}
.dual .art:last-child,.art:last-child{border:0;margin:0}
.art .when{font:400 .95rem Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.art p:not(.meta){margin:10px 0 0;text-align:justify;hyphens:auto;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.tags li{border:1px solid var(--ink);padding:1px 10px;font-size:.86rem}
.certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.cert{border:2px solid var(--ink);padding:16px 18px}
.cert p{margin:8px 0 0;font-size:.95rem;font-style:italic}
.badge{display:inline-block;font:400 .78rem Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink);padding:1px 8px;margin-bottom:8px}
.badge.f{background:var(--ink);color:var(--paper)}
.links{display:grid;gap:12px}
form{display:grid;gap:14px}
label{display:grid;gap:5px;font:400 .9rem Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase}
input,textarea{font:400 1rem "Libre Caslon Text",serif;color:var(--ink);background:rgba(255,248,235,.55);border:2px solid var(--ink);padding:9px 11px;width:100%;border-radius:0}
#msg{min-height:1.4em;font-size:.92rem;margin:0;font-style:italic}
footer{text-align:center;padding:18px 0 36px;font:400 .95rem Anton,sans-serif;letter-spacing:.12em;text-transform:uppercase}
@media (max-width:820px){.page{padding:24px 18px 32px}.cols,.dual{columns:1}.two,.fc{grid-template-columns:1fr}.grid>*{border-left:0;border-top:1px solid var(--ink);padding:16px 0}.grid>*:first-child{border-top:0}.brand{font-size:1.1rem}#pg{display:none}.dl{justify-content:center;font-size:.9rem}.page::before{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

$("exp-list").innerHTML=DATA.experience.map(e=>`<article class="art"><div class="when">${esc(e.dates)}</div><h3>${esc(e.role)}</h3><p class="meta">${esc(e.org)}${e.sub?` · ${esc(e.sub)}`:""} · ${esc(e.place)}</p>${list(e.points)}</article>`).join("");
$("proj-list").innerHTML=DATA.projects.map(p=>`<article class="art"><h3>${esc(p.title)}</h3><p class="meta">${esc(p.sub)}</p><p>${esc(p.desc)}</p>${tags(p.tech)}${p.repo?`<p>${ext("GitHub repository",p.repo)}</p>`:""}</article>`).join("");
$("cert-list").innerHTML=DATA.certs.map(c=>{const[s,k]=STATUS[c.status];const m=[c.date&&`Issued ${esc(c.date)}`,c.id&&`ID ${esc(c.id)}`].filter(Boolean).join(" · ");return`<article class="cert"><span class="${k}">${s}</span><h3>${esc(c.name)}</h3><p class="meta">${esc(c.org)}</p>${m?`<p class="meta">${m}</p>`:""}${c.items?list(c.items.map(i=>`${i[0]} – ${i[1]}`)):""}${c.note?`<p>${esc(c.note)}</p>`:""}${c.url?`<p>${ext("Verify",c.url)}</p>`:""}</article>`}).join("");
$("edu-list").innerHTML=DATA.education.map(e=>`<article class="art"><div class="when">${esc(e.dates)}</div><h3>${esc(e.school)}</h3><p class="meta">${esc(e.degree)} · ${esc(e.spec)}</p></article>`).join("");
$("dev-list").innerHTML=DATA.dev.map(([t,d])=>`<div><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("");
$("c-list").innerHTML=`<div><dt class="meta">Email</dt><dd style="margin:0"><a href="mailto:${esc(P.email)}">${esc(P.email)}</a></dd></div><div><dt class="meta">LinkedIn</dt><dd style="margin:0">${ext("ryan-almuqati",P.linkedin)}</dd></div><div><dt class="meta">GitHub</dt><dd style="margin:0">${ext("0xRyan1",P.github)}</dd></div><div><dt class="meta">Location</dt><dd style="margin:0">${esc(P.location)}</dd></div>`;
$("foot").textContent=`© ${new Date().getFullYear()} ${P.name} · ${P.location}`;
/* CV download */
$("cv").onclick=async()=>{const bytes=Uint8Array.from(atob(CV),c=>c.charCodeAt(0)),name="Ryan_Almqati_CV.pdf";
 try{const d=window.claude&&await window.claude.use("downloads");if(d){await d.save({filename:name,data:bytes});return}}catch(e){if(e&&e.code==="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download=name;a.click()};
/* nav */
const secs=[["about","About"],["skills","Skills"],["experience","Experience"],["projects","Projects"],["certifications","Certifications"],["education","Education"],["development","Development"],["contact","Contact"]];
$("navlinks").innerHTML=secs.map(([i,t])=>`<li><a href="#${i}">${t}</a></li>`).join("");
$("idx").innerHTML=secs.map(([i,t],k)=>`<li><a href="#${i}"><span>${t}</span><b>Page ${k+2}</b></a></li>`).join("");
const pages=[...document.querySelectorAll(".page")];pages.forEach((p,i)=>{if(i&&i%2===0)p.classList.add("b")});
$("pg").textContent=`Page 1 of ${pages.length}`;
pages.slice(1).forEach((p,i)=>{const r=document.createElement("div");r.className="run";r.innerHTML=`<span>${esc(P.name)}</span><span>Page ${i+2}</span><span>${today}</span>`;p.prepend(r)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll("#navlinks a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id));$("pg").textContent=`Page ${pages.indexOf(e.target)+1} of ${pages.length}`}}),{rootMargin:"-40% 0px -55% 0px"});
pages.forEach(p=>io.observe(p));
/* page flip: each page turns into place as it scrolls into view */
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const flip=()=>{const vh=innerHeight;pages.forEach(p=>{const x=Math.min(1,Math.max(0,(vh-p.getBoundingClientRect().top)/(vh*.6)));p.style.setProperty("--p",RM?1:1-Math.pow(1-x,3))})};
addEventListener("scroll",flip,{passive:true});addEventListener("resize",flip);flip();
/* contact: opens the visitor's mail app */
$("cform").onsubmit=ev=>{ev.preventDefault();const f=ev.target,m=$("msg");
 if(!f.n.value.trim()||!f.e.validity.valid||!f.m.value.trim()){m.textContent="Fill in your name, a valid email and a message.";return}
 location.href=`mailto:${P.email}?subject=${encodeURIComponent("Portfolio message from "+f.n.value)}&body=${encodeURIComponent(f.m.value+"\n\n"+f.n.value+" ("+f.e.value+")")}`;m.textContent="Opening your email app."};
</script>
</body>
